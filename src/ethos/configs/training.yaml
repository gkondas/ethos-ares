model_type: "decoder"
data_fp: ???
val_data_fp: /users/gbk2114/data/ethos-tokenize/tuning
val_size: ???
out_dir: "out"
eval_interval: 200
eval_iters: 200
log_interval: 1
resume: false
# logging
wandb_log: true
wandb_project: "ethos"
wandb_run_name: "ethos_run"
# training parameters
gradient_accumulation_steps: 40 # Assuming 5 * 8
batch_size: 32
# model parameters
n_positions: 2048
n_layer: 6
n_head: 12
n_embd: 768
dropout: 0.3
activation: "gelu"
# optimizer parameters
max_iters: 100000
lr: 0.0004 # Learning rate
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0
# learning rate schedule
warmup_iters: 2000
lr_decay_iters: 50000
min_lr: 0.00006
# system
backend: "nccl" # "nccl", "gloo"
device: "cuda" # "cuda", "cpu"
dtype: "bfloat16" # "float32", "bfloat16", "float16"
no_compile: false

hydra:
  output_subdir: null
